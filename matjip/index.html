<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>맛집 레이더</title>
  <meta name="description" content="블로그·카페 리뷰를 AI가 대신 읽고 평점을 매겨주는 동네 맛집 지도">
  <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="맛집 레이더">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="demo-banner" class="banner" hidden>
    샘플 데이터로 보는 중이에요. API 키를 넣으면 실제 동네 가게가 나와요. <a href="README.md" target="_blank" rel="noopener">설정 방법</a>
  </div>

  <header class="top">
    <div class="brand-row">
      <h1 class="brand">맛집<span>레이더</span></h1>
      <button id="locate" class="icon-btn" aria-label="현재 위치로">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
      </button>
    </div>
    <form id="search" class="search" autocomplete="off">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" enterkeyhint="search" placeholder="동네나 메뉴 · 성수동, 연남동, 평양냉면…">
      <select id="radius" aria-label="반경">
        <option value="300">300m</option>
        <option value="500" selected>500m</option>
        <option value="1000">1km</option>
        <option value="1500">1.5km</option>
        <option value="3000">3km</option>
        <option value="5000">5km</option>
      </select>
    </form>
    <div class="scope seg" role="tablist" aria-label="범위">
      <button data-scope="near" class="on">📍 이 동네</button>
      <button data-scope="region">🗺️ 서울·경기 전체</button>
    </div>
    <p id="where" class="where">위치를 찾는 중…</p>
  </header>

  <section class="themes" aria-label="테마">
    <button class="theme" data-theme="parents"><b>부모님과</b><small>정갈 · 조용 · 주차</small></button>
    <button class="theme" data-theme="view"><b>뷰 좋은 카페</b><small>루프탑 · 리버뷰</small></button>
    <button class="theme" data-theme="pretty"><b>눈이 즐거운 카페</b><small>감성 · 인테리어</small></button>
    <button class="theme" data-theme="parking"><b>주차 편한 곳</b><small>AI가 확인한 곳</small></button>
  </section>

  <nav id="cats" class="cats" aria-label="음식 종류"></nav>

  <div class="toolbar">
    <span id="count" class="count"></span>
    <div class="seg" role="tablist" aria-label="정렬">
      <button data-sort="dist" class="on">거리순</button>
      <button data-sort="score">AI점수순</button>
    </div>
    <div class="seg" role="tablist" aria-label="보기">
      <button data-view="grid" class="on" aria-label="카드">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="3" y="3" width="8" height="11" rx="2"/><rect x="13" y="3" width="8" height="7" rx="2"/><rect x="3" y="16" width="8" height="5" rx="2"/><rect x="13" y="12" width="8" height="9" rx="2"/></svg>
      </button>
      <button data-view="map" aria-label="지도">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      </button>
    </div>
  </div>

  <main>
    <div id="grid" class="grid"></div>
    <div id="bigmap" class="bigmap" hidden></div>
    <p id="empty" class="empty" hidden></p>
    <button id="more" class="more" hidden>더 보기</button>
  </main>

  <button id="ai-batch" class="fab" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2l1.8 5.6L19.5 9l-5.7 1.6L12 16l-1.8-5.4L4.5 9l5.7-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
    <span>보이는 곳 AI 평가</span>
  </button>

  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <article id="sheet" class="sheet" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <button id="sheet-close" class="sheet-close" aria-label="닫기">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="sheet-body" class="sheet-body"></div>
  </article>

  <div id="viewer" class="viewer" hidden>
    <img alt="" referrerpolicy="no-referrer" onerror="if(this.dataset.thumb&&this.src!==this.dataset.thumb)this.src=this.dataset.thumb">
    <div class="v-bar"><span class="v-count"></span><a class="v-src" target="_blank" rel="noopener">원본 글</a><button class="v-close" aria-label="닫기">✕</button></div>
    <p class="v-hint">좌우를 눌러 넘겨요</p>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
