<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7fb;color:#16181d;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:720px;margin:auto;padding:28px 16px 60px}
.eyebrow{font-size:12px;font-weight:900;color:#0e7490;letter-spacing:.08em}
h1{font-size:42px;letter-spacing:-.05em;margin:10px 0 8px}
p{color:#6b7280;line-height:1.6}
.card{display:block;margin-top:22px;padding:20px;border-radius:20px;background:#fff;border:1px solid #e5e7eb;text-decoration:none;color:#16181d;box-shadow:0 8px 28px rgba(17,24,39,.06)}
.card h2{margin:0 0 8px;font-size:22px}
.tag{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:#ecfeff;color:#0e7490;font-size:12px;font-weight:800}
.go{margin-top:16px;font-weight:900;color:#0284c7}
</style>
</head>
<body>
<main class="wrap">
<div class="eyebrow">TRAVEL</div>
<h1>여행</h1>
<p>여행별 체크리스트와 준비 자료를 모아두는 독립 폴더야.</p>
<a class="card" href="태국체크리스트/">
<h2>🇹🇭 태국 여행 체크리스트</h2>
<p>출국 전 필수, 돈·결제, 휴대폰, 의약품, 옷·신발, 귀국 전까지 한 번에 체크.</p>
<span class="tag">태국</span>
<div class="go">체크리스트 열기 →</div>
</a>
</main>
</body>
</html>
